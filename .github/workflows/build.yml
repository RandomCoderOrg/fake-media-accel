name: Build

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libva-dev libegl1-mesa-dev libgles2-mesa-dev libgl-dev libx11-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Check application probes
        run: |
          sh -n tools/fma-vlc-benchmark.sh
          python3 -m py_compile tools/fma-measure.py
          tools/fma-measure.py /tmp/fma-measure.txt 5 true
          grep -q '^timed_out=0$' /tmp/fma-measure.txt

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-android --parallel
